<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAVORA - Cozy Places</title>
  
  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style-cozy.css">
</head>
<body>

  <!-- Header Navigasi -->
  <header class="header-container">
    
    <!-- Group Logo & Tombol Back -->
    <div class="left-header-group">
      <div class="logo-box">
        <img src="logo.png" alt="SAVORA Logo" class="logo-img">
      </div>
      <a href="kategori.html" class="btn-back">
        <span>&larr;</span>
      </a>
    </div>

    <!-- Navigasi Kanan -->
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Beranda</a>
      <a href="kategori.html" class="nav-item active">Kategori</a>
      <a href="rekomendasi.html" class="nav-item">Rekomendasi</a>
    </nav>
  </header>

  <!-- Konten Utama -->
  <main class="main-content">
    
    <!-- Judul Kategori -->
    <div class="category-header-title">
      <h1>COZY</h1>
    </div>

    <!-- Banner Tengah & Kartu Tempat -->
    <div class="banner-wrapper">
      <div class="banner-bg"></div>

      <div class="place-cards-grid">
        
        <!-- 1. KARTU GETTSEE (Bisa diklik menuju gettsee.html) -->
        <a href="gettsee.html" class="place-card-link">
          <div class="place-card">
            <div class="store-icon-box">
              <span class="store-icon">&#127978;</span>
            </div>
            <div class="circle-frame">
              <img src="gettsee.jpg" alt="GETTSEE">
            </div>
            <h2 class="place-title">GETTSEE</h2>
          </div>
        </a>

        <!-- 2. KARTU ARGOLORO -->
        <a href="argoloro.html" class="place-card-link">
          <div class="place-card">
            <div class="store-icon-box">
              <span class="store-icon">&#127978;</span>
            </div>
            <div class="circle-frame">
              <img src="argoloro.jpg" alt="ARGOLORO">
            </div>
            <h2 class="place-title">ARGOLORO</h2>
          </div>
        </a>

        <!-- 3. KARTU MARGI -->
        <a href="margi.html" class="place-card-link">
          <div class="place-card">
            <div class="store-icon-box">
              <span class="store-icon">&#127978;</span>
            </div>
            <div class="circle-frame">
              <img src="margi.jpg" alt="MARGI">
            </div>
            <h2 class="place-title">MARGI</h2>
          </div>
        </a>

      </div>
    </div>
  </main>

</body>
</html>
